<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioteca — Why Politicians Keep Getting It So Wrong</title>
  <meta name="description" content="A single talk segmented into navigable chunks. Built with no∅ as the auteque example.">
  <meta name="novoid-media" content="https://secret-aardvark-418.convex.site">
  <script>document.documentElement.setAttribute('data-theme','dark');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/core.min.css">
  <link rel="stylesheet" href="../css/components.min.css">
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0b10;
  color: #d4d6dc;
  font-family: var(--nv-font-sans);
  min-height: 100vh;
  padding-bottom: 7rem;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

.ambient {
  position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background:
    radial-gradient(ellipse 55% 40% at 15% 10%, rgba(168,85,247,0.09) 0%, transparent 65%),
    radial-gradient(ellipse 45% 50% at 85% 80%, rgba(236,72,153,0.06) 0%, transparent 65%);
}

.page { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }

/* ── Header ─────────────────────────────────── */
.top {
  padding: 4rem 0 2rem;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 2rem; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 0.85rem;
}
.brand-mark {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  box-shadow: 0 8px 24px rgba(168,85,247,0.25);
}
.brand-text h1 {
  font-family: var(--nv-font-display);
  font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;
  color: #f2f3f7;
}
.brand-text p {
  font-size: 0.82rem; color: #7a7e90;
}

.search {
  display: flex; align-items: center; gap: 0.5rem;
  background: #13141b; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 0.55rem 0.85rem;
  min-width: 260px; transition: border-color 0.2s;
}
.search:focus-within { border-color: rgba(168,85,247,0.4); }
.search svg { color: #6b6f80; flex-shrink: 0; }
.search input {
  background: none; border: none; outline: none; color: #e5e7ee;
  font-family: inherit; font-size: 0.9rem; width: 100%;
}
.search input::placeholder { color: #5a5d6e; }

/* ── Filter chips ───────────────────────────── */
.chips {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem;
}
.chip {
  padding: 0.45rem 0.95rem;
  border-radius: 999px; font-size: 0.82rem; font-weight: 500;
  background: #13141b; border: 1px solid rgba(255,255,255,0.06);
  color: #8e92a5; transition: all 0.18s;
}
.chip:hover { color: #d4d6dc; border-color: rgba(255,255,255,0.12); }
.chip.active {
  background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(236,72,153,0.15));
  border-color: rgba(168,85,247,0.35); color: #f2f3f7;
}

/* ── Track list ─────────────────────────────── */
.tracks { display: flex; flex-direction: column; gap: 0.5rem; }
.track {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center; gap: 1rem;
  padding: 0.9rem 1rem;
  background: #12131a; border: 1px solid rgba(255,255,255,0.04);
  border-radius: 12px; transition: all 0.18s;
}
.track:hover { border-color: rgba(168,85,247,0.25); background: #151620; }
.track.active {
  border-color: rgba(168,85,247,0.5);
  background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(236,72,153,0.05));
}

.track-cover {
  width: 52px; height: 52px; border-radius: 10px;
  background: linear-gradient(135deg, #1e1f2b, #2a2c3d);
  display: flex; align-items: center; justify-content: center;
  color: #b8bccc;
  border: 1px solid rgba(255,255,255,0.06);
}
.track-cover svg { width: 22px; height: 22px; display: block; }
.track.active .track-cover {
  background: linear-gradient(135deg, #a855f7, #ec4899);
  border-color: transparent;
  color: white;
}

.track-meta { min-width: 0; }
.track-title {
  font-size: 0.98rem; font-weight: 600; color: #f0f1f5;
  letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.track-sub {
  font-size: 0.8rem; color: #7a7e90; margin-top: 0.1rem;
}
.track-cat {
  font-size: 0.72rem; font-weight: 500; padding: 0.22rem 0.55rem;
  border-radius: 6px; background: rgba(255,255,255,0.04);
  color: #9397a8; text-transform: uppercase; letter-spacing: 0.05em;
}
.track-duration {
  font-family: var(--nv-font-mono);
  font-size: 0.82rem; color: #7a7e90;
  font-variant-numeric: tabular-nums;
}
.track-play {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  color: #d4d6dc; transition: all 0.18s;
}
.track-play:hover { background: #a855f7; color: white; transform: scale(1.05); }
.track.active .track-play {
  background: linear-gradient(135deg, #a855f7, #ec4899); color: white;
}

/* ── Empty state ────────────────────────────── */
.empty {
  padding: 4rem 2rem; text-align: center; color: #6b6f80;
  background: #12131a; border-radius: 12px;
  border: 1px dashed rgba(255,255,255,0.06);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty-title { font-size: 1rem; color: #9397a8; margin-bottom: 0.25rem; }
.empty-sub { font-size: 0.85rem; }

/* ── Player bar (sticky bottom) ─────────────── */
.player {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10, 11, 16, 0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 0.9rem 1.5rem;
  z-index: 50;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.player.visible { transform: translateY(0); }

.player-inner {
  max-width: 960px; margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr);
  align-items: center; gap: 1.5rem;
}

.player-track { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
.player-cover {
  width: 42px; height: 42px; border-radius: 8px;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  display: flex; align-items: center; justify-content: center;
  color: white; flex-shrink: 0;
}
.player-cover svg { width: 18px; height: 18px; display: block; }
.player-info { min-width: 0; }
.player-title {
  font-size: 0.88rem; font-weight: 600; color: #f0f1f5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.player-author {
  font-size: 0.75rem; color: #7a7e90;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.player-controls { display: flex; align-items: center; gap: 0.5rem; }
.ctrl {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #9397a8; transition: all 0.18s;
}
.ctrl:hover { color: #f2f3f7; background: rgba(255,255,255,0.05); }
.ctrl.primary {
  width: 42px; height: 42px;
  background: #f2f3f7; color: #0a0b10;
}
.ctrl.primary:hover { background: white; transform: scale(1.05); }

.player-seek { display: flex; align-items: center; gap: 0.75rem; }
.time {
  font-family: var(--nv-font-mono);
  font-size: 0.75rem; color: #7a7e90;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
  min-width: 2.5rem; text-align: center;
}
.seekbar {
  flex: 1; height: 4px;
  background: rgba(255,255,255,0.08); border-radius: 2px;
  position: relative; cursor: pointer;
  overflow: hidden;
}
.seekbar-fill {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #a855f7, #ec4899);
  transform-origin: left; transition: transform 0.1s linear;
}
.seekbar:hover .seekbar-fill { background: linear-gradient(90deg, #c084fc, #f472b6); }

/* ── Responsive ─────────────────────────────── */
@media (max-width: 720px) {
  .top { padding: 2.5rem 0 1.5rem; }
  .search { min-width: unset; width: 100%; }
  .track { grid-template-columns: auto 1fr auto; gap: 0.75rem; }
  .track-cat { display: none; }
  .player-inner { grid-template-columns: minmax(0, 1fr) auto; }
  .player-seek { display: none; }
}
  </style>
</head>
<body>
  <div class="ambient"></div>
  <main class="page">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">♪</div>
        <div class="brand-text">
          <h1>Audioteca</h1>
          <p>Why Politicians Keep Getting It So Wrong · Barry's Economics</p>
        </div>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search the audioteca…" autocomplete="off" spellcheck="false">
      </div>
    </header>

    <div id="chips" class="chips"></div>
    <div id="tracks" class="tracks"></div>
  </main>

  <div id="player" class="player">
    <div class="player-inner">
      <div class="player-track">
        <div id="pCover" class="player-cover">♪</div>
        <div class="player-info">
          <div id="pTitle" class="player-title">—</div>
          <div id="pAuthor" class="player-author">—</div>
        </div>
      </div>
      <div class="player-controls">
        <button id="btnPrev" class="ctrl" aria-label="Anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btnPlay" class="ctrl primary" aria-label="Play/Pause">
          <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="btnNext" class="ctrl" aria-label="Siguiente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-9.5 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </button>
      </div>
      <div class="player-seek">
        <span id="tCur" class="time">0:00</span>
        <div id="seekbar" class="seekbar">
          <div id="seekFill" class="seekbar-fill" style="transform: scaleX(0)"></div>
        </div>
        <span id="tDur" class="time">0:00</span>
      </div>
    </div>
  </div>

  <script src="../js/core.min.js"></script>
  <script>
  (function () {
    const N = Novoid;

    // ── Category icons (line-art SVG, inherit currentColor) ───────
    const ICONS = {
      intro:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
          '<line x1="5" y1="10" x2="5" y2="14"/>' +
          '<line x1="9.5" y1="7" x2="9.5" y2="17"/>' +
          '<line x1="14.5" y1="4" x2="14.5" y2="20"/>' +
          '<line x1="19" y1="9" x2="19" y2="15"/>' +
        '</svg>',
      lecture:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="9" y="3" width="6" height="11" rx="3"/>' +
          '<path d="M6 11a6 6 0 0 0 12 0"/>' +
          '<line x1="12" y1="17" x2="12" y2="21"/>' +
          '<line x1="9" y1="21" x2="15" y2="21"/>' +
        '</svg>',
      guide:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/>' +
          '<path d="M4 14h3a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>' +
          '<path d="M20 14h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/>' +
        '</svg>',
      interview:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 8a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H7l-2 2v-2H5a2 2 0 0 1-2-2z"/>' +
          '<path d="M10 16v1a2 2 0 0 0 2 2h5l2 2v-2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2h-2"/>' +
        '</svg>'
    };

    // ── Curated seed ──────────────────────────────────────────────
    const SEED = [
      {
        id: 't1',
        title: "Context of Benefit System Debate",
        author: "Barry's Economics",
        category: 'Premise',
        icon: 'lecture',
        url: '/img/audioteca-t1.mp3'
      },
      {
        id: 't2',
        title: "Science's Role in Understanding Poverty",
        author: "Barry's Economics",
        category: 'Argument',
        icon: 'lecture',
        url: '/img/audioteca-t2.mp3'
      },
      {
        id: 't3',
        title: "Empathy Reduction in Wealthy Individuals",
        author: "Barry's Economics",
        category: 'Evidence',
        icon: 'lecture',
        url: '/img/audioteca-t3.mp3'
      },
      {
        id: 't4',
        title: "Consequences of Homophily in Policy Making",
        author: "Barry's Economics",
        category: 'Argument',
        icon: 'lecture',
        url: '/img/audioteca-t4.mp3'
      },
      {
        id: 't5',
        title: "Blind Spots in Economic Policy",
        author: "Barry's Economics",
        category: 'Synthesis',
        icon: 'lecture',
        url: '/img/audioteca-t5.mp3'
      },
      {
        id: 't6',
        title: "Strategies for Inclusive Decision Making",
        author: "Barry's Economics",
        category: 'Synthesis',
        icon: 'guide',
        url: '/img/audioteca-t6.mp3'
      },
      {
        id: 't7',
        title: "The Importance of Evidence-Based Debates",
        author: "Barry's Economics",
        category: 'Argument',
        icon: 'guide',
        url: '/img/audioteca-t7.mp3'
      }
    ];

    const CATEGORIES = ['All', 'Premise', 'Argument', 'Evidence', 'Synthesis'];

    // ── Store ─────────────────────────────────────────────────────
    const store = N.createStore(
      {
        tracks: SEED,
        currentTrackId: null,
        isPlaying: false,
        selectedCategory: 'All',
        searchQuery: '',
        currentTime: 0,
        duration: 0,
        seekRequest: null
      },
      {
        play(state, id) {
          const tid = id || state.currentTrackId;
          if (!tid) return {};
          return { currentTrackId: tid, isPlaying: true };
        },
        pause() { return { isPlaying: false }; },
        toggle(state) {
          if (!state.currentTrackId) return {};
          return { isPlaying: !state.isPlaying };
        },
        selectCategory(_, cat) { return { selectedCategory: cat }; },
        setSearch(_, q) { return { searchQuery: q || '' }; },
        next(state) {
          const list = filtered(state);
          if (!list.length) return {};
          const idx = list.findIndex(t => t.id === state.currentTrackId);
          const nxt = list[(idx + 1) % list.length];
          return { currentTrackId: nxt.id, isPlaying: true };
        },
        previous(state) {
          const list = filtered(state);
          if (!list.length) return {};
          const idx = list.findIndex(t => t.id === state.currentTrackId);
          const prv = list[(idx - 1 + list.length) % list.length];
          return { currentTrackId: prv.id, isPlaying: true };
        },
        setTime(_, { currentTime, duration }) {
          return { currentTime, duration: duration || 0 };
        },
        seek(_, ratio) { return { seekRequest: { ratio, at: Date.now() } }; },
        ended() { return { isPlaying: false, currentTime: 0 }; }
      }
    );

    function filtered(state) {
      const q = (state.searchQuery || '').trim().toLowerCase();
      const cat = state.selectedCategory;
      return state.tracks.filter(t => {
        if (cat !== 'All' && t.category !== cat) return false;
        if (q && !(t.title.toLowerCase().includes(q) || t.author.toLowerCase().includes(q))) return false;
        return true;
      });
    }

    function fmtTime(s) {
      if (!s || !isFinite(s)) return '0:00';
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // ── Audio element (singleton) ─────────────────────────────────
    // Guarded: Audio constructor only exists in real browsers, not the headless verifier.
    const currentId = store.select('currentTrackId');
    const isPlaying = store.select('isPlaying');
    const seekReq = store.select('seekRequest');
    const audio = (typeof Audio !== 'undefined') ? new Audio() : null;

    if (audio) {
      audio.preload = 'metadata';
      audio.addEventListener('timeupdate', () => {
        store.actions.setTime({ currentTime: audio.currentTime, duration: audio.duration || 0 });
      });
      audio.addEventListener('loadedmetadata', () => {
        store.actions.setTime({ currentTime: audio.currentTime, duration: audio.duration || 0 });
      });
      audio.addEventListener('ended', () => store.actions.ended());

      let lastLoadedId = null;
      N.effect(() => {
        const id = currentId();
        if (!id) { audio.pause(); audio.removeAttribute('src'); lastLoadedId = null; return; }
        if (id !== lastLoadedId) {
          const track = SEED.find(t => t.id === id);
          if (track) { audio.src = track.url; lastLoadedId = id; }
        }
      });

      N.effect(() => {
        const playing = isPlaying();
        const id = currentId();
        if (!id) return;
        if (playing) {
          const p = audio.play();
          if (p && p.catch) p.catch(() => store.actions.pause());
        } else {
          audio.pause();
        }
      });

      N.effect(() => {
        const req = seekReq();
        if (!req || !audio.duration) return;
        audio.currentTime = req.ratio * audio.duration;
      });
    }

    // ── Render: chips ─────────────────────────────────────────────
    const chipsEl = document.getElementById('chips');
    const selectedCat = store.select('selectedCategory');
    if (chipsEl) {
      CATEGORIES.forEach(cat => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = cat;
        b.addEventListener('click', () => store.actions.selectCategory(cat));
        chipsEl.appendChild(b);
        N.effect(() => {
          b.classList.toggle('active', selectedCat() === cat);
        });
      });
    }

    // ── Render: search ────────────────────────────────────────────
    const searchEl = document.getElementById('search');
    if (searchEl) searchEl.addEventListener('input', e => store.actions.setSearch(e.target.value));

    // ── Render: track list ────────────────────────────────────────
    const tracksEl = document.getElementById('tracks');
    const searchQ = store.select('searchQuery');

    const visibleTracks = N.computed(() => {
      const state = { tracks: SEED, selectedCategory: selectedCat(), searchQuery: searchQ() };
      return filtered(state);
    });

    N.effect(() => {
      const list = visibleTracks();
      if (!tracksEl) return;
      tracksEl.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<div class="empty-icon">∅</div><div class="empty-title">No results</div><div class="empty-sub">Try a different category or search term.</div>';
        tracksEl.appendChild(empty);
        return;
      }
      list.forEach(t => {
        const row = document.createElement('button');
        row.className = 'track';

        const cover = document.createElement('div');
        cover.className = 'track-cover';
        cover.innerHTML = ICONS[t.icon] || '';

        const meta = document.createElement('div');
        meta.className = 'track-meta';
        const title = document.createElement('div');
        title.className = 'track-title';
        title.textContent = t.title;
        const sub = document.createElement('div');
        sub.className = 'track-sub';
        sub.textContent = t.author;
        meta.appendChild(title);
        meta.appendChild(sub);

        const cat = document.createElement('span');
        cat.className = 'track-cat';
        cat.textContent = t.category;

        const play = document.createElement('div');
        play.className = 'track-play';
        play.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

        row.appendChild(cover);
        row.appendChild(meta);
        row.appendChild(cat);
        row.appendChild(play);
        row.addEventListener('click', () => store.actions.play(t.id));

        N.effect(() => {
          row.classList.toggle('active', currentId() === t.id);
        });

        tracksEl.appendChild(row);
      });
    });

    // ── Render: player bar ────────────────────────────────────────
    const playerEl = document.getElementById('player');
    const pTitle = document.getElementById('pTitle');
    const pAuthor = document.getElementById('pAuthor');
    const pCover = document.getElementById('pCover');
    const tCur = document.getElementById('tCur');
    const tDur = document.getElementById('tDur');
    const seekFill = document.getElementById('seekFill');
    const seekbar = document.getElementById('seekbar');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPlay = document.getElementById('btnPlay');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');

    N.effect(() => {
      const id = currentId();
      if (playerEl) playerEl.classList.toggle('visible', !!id);
      if (!id) return;
      const t = SEED.find(x => x.id === id);
      if (!t) return;
      if (pTitle) pTitle.textContent = t.title;
      if (pAuthor) pAuthor.textContent = t.author + ' · ' + t.category;
      if (pCover) pCover.innerHTML = ICONS[t.icon] || '';
    });

    N.effect(() => {
      const p = isPlaying();
      if (iconPlay) iconPlay.style.display = p ? 'none' : 'block';
      if (iconPause) iconPause.style.display = p ? 'block' : 'none';
    });

    const currentTime = store.select('currentTime');
    const duration = store.select('duration');

    N.effect(() => {
      const c = currentTime(), d = duration();
      if (tCur) tCur.textContent = fmtTime(c);
      if (tDur) tDur.textContent = fmtTime(d);
      const ratio = d > 0 ? c / d : 0;
      if (seekFill) seekFill.style.transform = 'scaleX(' + ratio + ')';
    });

    if (btnPlay) btnPlay.addEventListener('click', () => store.actions.toggle());
    if (btnNext) btnNext.addEventListener('click', () => store.actions.next());
    if (btnPrev) btnPrev.addEventListener('click', () => store.actions.previous());
    if (seekbar) seekbar.addEventListener('click', e => {
      const rect = seekbar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      store.actions.seek(ratio);
    });

    // Expose store for MCP test harness
    window.__store = store;
  })();
  </script>
</body>
</html>
