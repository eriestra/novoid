      const rows = conceptCurves
        .filter(c => a[c.id] !== false)
        .map(c => ({ c, v: valueAt(c.curve, r) }))
        .sort((x, y) => y.v - x.v)
        .slice(0, 4);
      tooltipEl.innerHTML =
        '<div class="tooltip-time">' + fmtTime(t) + '</div>' +
        rows.map(({ c, v }) =>
          '<div class="tt-row">' +
            '<span class="tt-dot" style="background:' + c.color + '"></span>' +
            '<span class="tt-label">' + c.label + '</span>' +
            '<span class="tt-val">' + v.toFixed(2) + '</span>' +
          '</div>'
        ).join('');
      const wrapW = plotWrap.clientWidth || PLOT_W;
      const px = r * wrapW;
      tooltipEl.style.left = px + 'px';
      tooltipEl.style.top = '60px';
      tooltipEl.classList.add('visible');
    });

    // ── Plot interactions ─────────────────────────────────────────
    function ratioFromEvent(ev) {
      const rect = svg.getBoundingClientRect();
      const x = ev.clientX - rect.left;
      return Math.max(0, Math.min(1, x / rect.width));
    }
    svg.addEventListener('mousemove', (ev) => store.actions.setHover(ratioFromEvent(ev)));
    svg.addEventListener('mouseleave', () => store.actions.clearHover());
    svg.addEventListener('click', (ev) => {
      const r = ratioFromEvent(ev);
      store.actions.seek(r);
      if (!isPlaying()) store.actions.play();
    });

    // ── Time axis ─────────────────────────────────────────────────
    const axisEl = document.getElementById('axis');
    function buildAxis() {
      const d = MANIFEST.duration;
      const stepCandidates = [30, 60, 120, 180, 300, 600];
      let step = stepCandidates[0];
      for (const s of stepCandidates) { if (d / s <= 8) { step = s; break; } }
      const ticks = [];
      for (let t = 0; t <= d + 0.5; t += step) ticks.push(Math.min(t, d));
      if (ticks[ticks.length - 1] < d - 1) ticks.push(d);
      axisEl.innerHTML = '';
      for (let i = 0; i < ticks.length; i++) {
        const span = document.createElement('span');
        span.textContent = fmtTime(ticks[i]);
        axisEl.appendChild(span);
      }
    }
    buildAxis();

    // ── Lens chips ────────────────────────────────────────────────
    const chipsEl = document.getElementById('chips');
    for (const c of conceptCurves) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.innerHTML = '<span class="chip-dot"></span><span>' + c.label + '</span>';
      const dot = b.querySelector('.chip-dot');
      if (dot) dot.style.background = c.color;
      b.addEventListener('click', () => store.actions.toggleConcept(c.id));
      b.addEventListener('mouseenter', () => store.actions.highlightConcept(c.id));
      b.addEventListener('mouseleave', () => store.actions.clearHighlight());
      chipsEl.appendChild(b);
      N.effect(() => {
        const a = active();
        const h = highlighted();
        const isActive = a[c.id] !== false;
        b.classList.toggle('active', isActive);
        b.classList.toggle('dim', h !== '' && h !== c.id);
        if (dot) {
          dot.style.boxShadow = isActive
            ? '0 0 8px ' + c.color
            : '0 0 0 2px rgba(0,0,0,0.4) inset';
        }
      });
    }

    // ── Player bar bindings ───────────────────────────────────────
    const tCur = document.getElementById('tCur');
    const tDur = document.getElementById('tDur');
    const seekFill = document.getElementById('seekFill');
    const seekbar = document.getElementById('seekbar');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPlay = document.getElementById('btnPlay');

    N.effect(() => {
      const c = currentTime(), d = duration() || MANIFEST.duration;
      tCur.textContent = fmtTime(c);
      tDur.textContent = fmtTime(d);
      const ratio = d > 0 ? c / d : 0;
      seekFill.style.transform = 'scaleX(' + ratio + ')';
    });
    N.effect(() => {
      const p = isPlaying();
      iconPlay.style.display = p ? 'none' : 'block';
      iconPause.style.display = p ? 'block' : 'none';
    });

    btnPlay.addEventListener('click', () => store.actions.toggle());
    seekbar.addEventListener('click', (ev) => {
      const rect = seekbar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      store.actions.seek(ratio);
    });

    // Expose for MCP test harness
    window.__store = store;
  })();
  </script>
</body>
</html>
