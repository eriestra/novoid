<!DOCTYPE html>
<html>
<head>
    <title>Focus Preservation Test</title>
    <script src="../../src/core.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
        const { h, signal, effect, mount, when, batch } = Novoid;
        const results = [];

        // Signals that will trigger sibling re-renders
        const [name, setName] = signal('');
        const [loading, setLoading] = signal(false);
        const [error, setError] = signal(null);
        const [data, setData] = signal(null);

        mount('#app', () =>
            h('div', {},
                // Input with bind
                h('input', { id: 'test-input', bind: [name, setName] }),
                // Sibling reactive blocks (these re-render when signals change)
                h('button', { disabled: () => loading() || !name() },
                    () => loading() ? 'Loading...' : 'Submit'
                ),
                when(() => error(), () => h('div', { class: 'error' }, () => error())),
                when(() => data(), () => h('div', { class: 'data' }, () => JSON.stringify(data()))),
                when(() => !data() && !loading() && !error(), () => h('p', {}, 'Empty state')),
            )
        );

        // ─── Test 1: Focus preserved after typing (bind update) ─────
        const input = document.querySelector('#test-input');
        input.focus();
        results.push({
            test: 'initial_focus',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        // Simulate typing — this updates the signal, triggering sibling effects
        input.value = 'hello';
        input.dispatchEvent(new Event('input', { bubbles: true }));

        results.push({
            test: 'focus_after_typing',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
            signalValue: name(),
        });

        // ─── Test 2: Focus preserved after unbatched sibling updates ─
        setLoading(true);
        results.push({
            test: 'focus_after_setLoading',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        setLoading(false);
        setError('Something went wrong');
        results.push({
            test: 'focus_after_setError',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        setError(null);
        results.push({
            test: 'focus_after_clearError',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        // ─── Test 3: Focus preserved after batched updates ──────────
        input.focus(); // re-focus in case
        batch(() => {
            setLoading(true);
            setError(null);
            setData(null);
        });
        results.push({
            test: 'focus_after_batch_start',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        batch(() => {
            setData({ items: [1, 2, 3] });
            setLoading(false);
        });
        results.push({
            test: 'focus_after_batch_complete',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        // ─── Test 4: Focus preserved with rapid signal toggling ─────
        input.focus();
        for (let i = 0; i < 10; i++) {
            setLoading(i % 2 === 0);
            setError(i % 3 === 0 ? 'err' : null);
        }
        results.push({
            test: 'focus_after_rapid_toggles',
            pass: document.activeElement === input,
            activeElement: document.activeElement?.id || document.activeElement?.tagName,
        });

        // Export results for novoid-browser to read
        const allPassed = results.every(r => r.pass);
        console.log('FOCUS_TEST_RESULTS: ' + JSON.stringify({ allPassed, results }));

        // Store in a signal so it shows up in observed state
        const [testResults, setTestResults] = signal(results);
        const [testPassed, setTestPassed] = signal(allPassed);
    </script>
</body>
</html>
