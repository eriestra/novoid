<!DOCTYPE html>
<html>
<head>
    <title>Simple Counter</title>
    <script src="../../src/core.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
        const [count, setCount] = Novoid.signal(0);
        const [name, setName] = Novoid.signal('World');

        const store = Novoid.createStore(
            { tasks: [{ id: 1, text: 'Buy milk' }, { id: 2, text: 'Write code' }] },
            {
                addTask: (state, text) => ({ ...state, tasks: [...state.tasks, { id: state.tasks.length + 1, text }] }),
                removeTask: (state, id) => ({ ...state, tasks: state.tasks.filter(t => t.id !== id) }),
            }
        );

        const Greeting = Novoid.component('Greeting', (props) => {
            return Novoid.h('h1', {}, () => 'Hello, ' + name() + '!');
        });

        Novoid.mount('#app', () =>
            Novoid.h('div', {},
                Greeting(),
                Novoid.h('p', {}, () => 'Count: ' + count()),
                Novoid.h('button', { onClick: () => setCount(c => c + 1) }, 'Increment'),
            )
        );
    </script>
</body>
</html>
